html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">
<style>html, body { overscroll-behavior: none; touch-action: none; background: #17110c; }</style>
<script>
// The game needs a cross-origin isolated page (it uses threads). On hosts that
// cannot send the headers for that, the service worker adds them - but only to
// pages it controls, and the first page load (and sometimes the reload right
// after installing it) is not one of those. So: if the worker is installed and
// this page is still not isolated, reload, at most three times per tab.
(function () {
	if (window.crossOriginIsolated || !('serviceWorker' in navigator)) {
		try { sessionStorage.removeItem('isolationReloads'); } catch (e) {}
		return;
	}
	var count = 0;
	try { count = Number(sessionStorage.getItem('isolationReloads') || 0); } catch (e) {}
	if (count >= 3) {
		return;
	}
	navigator.serviceWorker.ready.then(function () {
		try { sessionStorage.setItem('isolationReloads', String(count + 1)); } catch (e) {}
		setTimeout(function () { window.location.reload(); }, 400);
	});
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.09, 0.066, 0.047, 1)
